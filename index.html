<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Toko Online lilahsan</title>
<link rel="icon" type="image/png" href="img/logo-lilahsan.png">
  <style>
    :root{
      --bg:#0b0b0c;
      --card:#121217;
      --line:#24242a;
      --text:#eaeaea;
      --muted:#bdbdbd;
      --btn:#191922;
      --radius:16px;
    }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:system-ui,Arial,sans-serif; background:var(--bg); color:var(--text); }
    .wrap{ max-width:980px; margin:0 auto; padding:18px; }

    header{
      display:flex; align-items:center; justify-content:space-between;
      gap:12px; flex-wrap:wrap;
      padding:14px 0;
    }
    .brand{ display:flex; flex-direction:column; gap:4px; }
    h1{ margin:0; font-size:18px; }
    .sub{ margin:0; font-size:13px; color:var(--muted); }

    .top-actions{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    input[type="search"]{
      width:min(520px, 100%);
      padding:12px 14px;
      border-radius:14px;
      border:1px solid var(--line);
      background:#141419;
      color:var(--text);
      outline:none;
    }
    input[type="search"]::placeholder{ color:#8f8f95; }

    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      gap:8px;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid var(--line);
      background:var(--btn);
      color:var(--text);
      text-decoration:none;
      cursor:pointer;
      font-size:14px;
      white-space:nowrap;
    }
    .btn:hover{ filter:brightness(1.08); }

    .grid{
      margin-top:14px;
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
      gap:12px;
    }
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .thumb{
      width:100%;
      aspect-ratio: 4/3;
      background:#0f0f14;
      display:flex; align-items:center; justify-content:center;
      overflow:hidden;
    }
    .thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .content{ padding:14px; display:flex; flex-direction:column; gap:10px; }
    .title{ font-weight:800; font-size:15px; }
    .small{ font-size:13px; color:var(--muted); line-height:1.4; }

    .floating-wa{
      position:fixed; right:16px; bottom:16px;
      width:56px; height:56px;
      border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      background:#1f8f4e;
      color:#fff; text-decoration:none;
      font-size:24px;
      box-shadow:0 10px 30px rgba(0,0,0,.35);
      z-index:9999;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div style="display:flex;align-items:center;gap:12px;">
  <img src="img/logo-lilahsan.png"
       alt="Logo Lilahsan"
       style="width:44px;height:44px;border-radius:10px;object-fit:cover;">
  <h1>Toko Online Lilahsan</h1>
</div>
        <p class="sub">Order via WhatsApp • © <span id="year"></span></p>
      </div>

      <div class="top-actions">
        <input id="search" type="search" placeholder="Cari produk..." autocomplete="off" />
        <a id="waAdminTop" class="btn" target="_blank" rel="noopener">💬 WA Admin</a>
      </div>
    </header>

    <div id="product-list" class="grid"></div>
  </div>

  <a id="waAdminFloat" class="floating-wa" target="_blank" rel="noopener" aria-label="WhatsApp Admin">🟢</a>

  <script>
    // =========================
    // 1) GANTI NOMOR WA DI SINI
    // =========================
    const WA_NUMBER = "6285887443293"; // contoh: 62812xxxxxxx (tanpa +, tanpa spasi)

    // =========================
    // 2) EDIT PRODUK DI SINI
    //    Pastikan file gambar ada di repo:
    //    /img/produk1.jpg, dst
    // =========================
    const products = [
      { img: "img/produk1.jpg", name: "pocong premium" },
      { img: "img/produk2.jpg", name: "kaka" },
      { img: "img/produk3.jpg", name: "nailong lucu" },
      // tambah produk di sini:
      // { img: "img/produk4.jpg", name: "nama produk" },
    ];

    // =========================
    // UTIL
    // =========================
    function waLink(text){
      return `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(text)}`;
    }

    function orderMessage(productName){
      return [
        "Halo Admin lilahsan, saya mau order:",
        "",
        `- Produk: ${productName}`,
        "- Jumlah: 1",
        "- Nama:",
        "- Alamat:",
        "- Metode bayar: Transfer/COD",
        "",
        "Terima kasih"
      ].join("\n");
    }

    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    // =========================
    // RENDER
    // =========================
    function renderProducts(){
      const container = document.getElementById("product-list");
      const q = (document.getElementById("search").value || "").toLowerCase().trim();
      container.innerHTML = "";

      const filtered = products.filter(p => (p.name || "").toLowerCase().includes(q));

      if(filtered.length === 0){
        container.innerHTML = `
          <div class="card">
            <div class="content">
              <div class="title">Produk tidak ditemukan</div>
              <div class="small">Coba kata kunci lain.</div>
            </div>
          </div>
        `;
        return;
      }

      const frag = document.createDocumentFragment();

      filtered.forEach((p) => {
        const name = p?.name ? String(p.name) : "-";
        const img = p?.img ? String(p.img) : "";
        const msg = orderMessage(name);

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="thumb">
            ${img
              ? `<img src="${escapeHtml(img)}" alt="${escapeHtml(name)}" loading="lazy">`
              : `<div class="small">Tidak ada foto</div>`
            }
          </div>

          <div class="content">
            <div class="title">${escapeHtml(name)}</div>
            <div class="small">Klik tombol di bawah untuk order via WhatsApp.</div>
            <a class="btn" href="${waLink(msg)}" target="_blank" rel="noopener">🛍️ Order WA</a>
          </div>
        `;

        frag.appendChild(card);
      });

      container.appendChild(frag);
    }

    // =========================
    // INIT
    // =========================
    document.getElementById("year").innerText = new Date().getFullYear();

    const adminText = "Halo Admin toko online lilahsan, saya mau tanya produk.";
    document.getElementById("waAdminTop").href = waLink(adminText);
    document.getElementById("waAdminFloat").href = waLink(adminText);

    document.getElementById("search").addEventListener("input", renderProducts);

    renderProducts();
    document.getElementById("yearFooter").innerText = new Date().getFullYear();
document.getElementById("waFooter").href =
  waLink("Halo Admin Toko Online Lilahsan, saya mau tanya produk.");
  </script>
  <footer class="footer">
    <div class="footer-wrap">
      <div>
        <h3>Toko Online Lilahsan</h3>
        <p>Alamat:<br>
          Jl. benda raya No. 11823<br>
          dki jakarta, kec.kalideres kel.kamal
        </p>
      </div>

      <div>
        <h3>Kontak</h3>
        <p>
          WhatsApp:
          <a id="waFooter" target="_blank" rel="noopener">
            0858-5874-43293
          </a>
          <br>
          Email: sandihermasnyah816@gmail.com
        </p>
      </div>
    </div>

    <div class="footer-copy">
      © <span id="yearFooter"></span> Toko Online Lilahsan
    </div>
  </footer>
</body>
</html>
