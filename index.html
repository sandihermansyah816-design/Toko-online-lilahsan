<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lilahsan | Marketplace Style</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
:root{
  --orange:#ee4d2d;
  --orange-soft:#fff0ec;
  --green:#22c55e;
  --bg:#f5f5f5;
  --text:#222;
  --muted:#777;
  --card:#fff;
  --shadow:0 8px 20px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:var(--bg);
  color:var(--text);
}
a{text-decoration:none;color:inherit}

/* HEADER */
header{
  position:sticky;
  top:0;
  background:#fff;
  border-bottom:1px solid #eee;
  z-index:100;
}
.header-inner{
  max-width:1100px;
  margin:auto;
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
}
.brand img{
  width:44px;
  height:44px;
  border-radius:10px;
}
.brand h1{
  font-size:18px;
  margin:0;
  font-weight:900;
  color:var(--orange);
}
.sub{font-size:12px;color:var(--muted)}

.searchbar{
  display:flex;
  gap:10px;
}
input[type="search"]{
  padding:10px 14px;
  border-radius:999px;
  border:1px solid #ddd;
  width:220px;
}
.btn{
  padding:10px 14px;
  border-radius:999px;
  font-weight:800;
  border:none;
  cursor:pointer;
}
.btn-wa{
  background:var(--green);
  color:#fff;
}

/* LAYOUT */
.wrap{
  max-width:1100px;
  margin:auto;
  padding:16px;
}

/* SLIDER */
.slider{
  border-radius:16px;
  overflow:hidden;
  box-shadow:var(--shadow);
}
.slide{display:none}
.slide.active{display:block}
.slide img{width:100%;display:block}

/* SECTION */
.section-title{
  margin:18px 0 10px;
  font-size:20px;
  font-weight:900;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
@media(min-width:768px){
  .grid{grid-template-columns:repeat(4,1fr)}
}

/* CARD */
.card{
  background:var(--card);
  border-radius:16px;
  box-shadow:var(--shadow);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.thumb{
  position:relative;
  aspect-ratio:1/1;
  background:#eee;
}
.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.badge{
  position:absolute;
  top:10px;
  left:10px;
  background:var(--orange);
  color:#fff;
  font-size:11px;
  font-weight:900;
  padding:4px 8px;
  border-radius:999px;
}
.content{
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:6px;
  flex:1;
}
.title{font-size:13px;font-weight:800}
.rating{color:#facc15;font-size:12px}
.price{font-size:14px;font-weight:900}
.card .btn{margin-top:auto;background:var(--green);color:#fff;text-align:center}

/* PANEL */
.panel{
  background:#fff;
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:16px;
  margin-top:16px;
}

/* FOOTER */
footer{
  margin-top:20px;
  background:#fff;
  padding:16px;
  border-radius:16px;
  box-shadow:var(--shadow);
}
.footer-copy{
  text-align:center;
  font-size:13px;
  color:var(--muted);
}

/* FLOAT WA */
.float-wa{
  position:fixed;
  right:16px;
  bottom:16px;
  width:56px;
  height:56px;
  border-radius:999px;
  background:var(--green);
  color:#fff;
  display:grid;
  place-items:center;
  font-size:22px;
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <img src="./img/logo-lilahsan.png">
      <div>
        <h1>Lilahsan</h1>
        <div class="sub">Marketplace Style • WhatsApp Order</div>
      </div>
    </div>
    <div class="searchbar">
      <input id="search" type="search" placeholder="Cari produk...">
      <a id="waAdminTop" class="btn btn-wa">WA Admin</a>
    </div>
  </div>
</header>

<div class="wrap">

<!-- SLIDER -->
<div class="slider">
  <div class="slide active"><img src="./img/banner1.jpg"></div>
  <div class="slide"><img src="./img/banner2.jpg"></div>
  <div class="slide"><img src="./img/banner3.jpg"></div>
</div>

<h2 class="section-title">Produk Unggulan</h2>
<div id="product-list" class="grid"></div>

<div class="panel">
  <h2 class="section-title">Tentang Lilahsan</h2>
  <p>Lilahsan adalah toko online bergaya marketplace yang melayani pemesanan cepat melalui WhatsApp.</p>
</div>

<div class="panel">
  <h2 class="section-title">Cara Order</h2>
  <ol>
    <li>Pilih produk</li>
    <li>Klik tombol Order WA</li>
    <li>Chat admin & konfirmasi</li>
  </ol>
</div>

<footer>
  <div class="footer-copy">© <span id="year"></span> Lilahsan</div>
</footer>

</div>

<a id="waAdminFloat" class="float-wa">
  <i class="fa-brands fa-whatsapp"></i>
</a>

<script>
const WA_NUMBER="62858587443293";

const products=[
  {img:"./img/produk1.jpg",name:"Sepatu Kaca Premium",price:25000,badge:"Best Seller",rating:5},
  {img:"./img/produk2.jpg",name:"Sepatu Kaca Elegan",price:28000,badge:"Promo",rating:4},
  {img:"./img/produk3.jpg",name:"Sepatu Kaca Mewah",price:32000,badge:"Ready",rating:5}
];

function walink(t){
  return "https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(t);
}
function stars(n){
  return "★".repeat(n)+"☆".repeat(5-n);
}
function renderProducts(){
  const list=document.getElementById("product-list");
  const q=(document.getElementById("search").value||"").toLowerCase();
  list.innerHTML="";
  products.filter(p=>p.name.toLowerCase().includes(q)).forEach(p=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <div class="thumb">
        ${p.badge?`<span class="badge">${p.badge}</span>`:""}
        <img src="${p.img}">
      </div>
      <div class="content">
        <div class="title">${p.name}</div>
        <div class="rating">${stars(p.rating)}</div>
        <div class="price">Rp ${p.price.toLocaleString("id-ID")}</div>
        <a class="btn" href="${walink("Halo Admin, saya mau order "+p.name)}" target="_blank">
          Order WA
        </a>
      </div>`;
    list.appendChild(card);
  });
}

/* SLIDER */
let idx=0;
setInterval(()=>{
  const slides=document.querySelectorAll(".slide");
  slides[idx].classList.remove("active");
  idx=(idx+1)%slides.length;
  slides[idx].classList.add("active");
},3500);

document.addEventListener("DOMContentLoaded",()=>{
  document.getElementById("year").innerText=new Date().getFullYear();
  document.getElementById("waAdminTop").href=walink("Halo Admin Lilahsan");
  document.getElementById("waAdminFloat").href=walink("Halo Admin Lilahsan");
  document.getElementById("search").addEventListener("input",renderProducts);
  renderProducts();
});
</script>

</body>
</html>
